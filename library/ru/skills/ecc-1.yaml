ecc/accessibility:
  cat: dev-frontend
  what: Проектирование, реализация и аудит доступных интерфейсов по WCAG 2.2 AA для веба, iOS и Android.
  skills: семантика и ARIA-роли; трейты и подсказки доступности в мобильных ОС; управление фокусом и клавиатурой; контраст и размер зон касания; поддержка экранных дикторов.
  tasks: аудит интерфейса на доступность; исправление нарушений WCAG; подготовка к требованиям законодательства о доступности.
  with: ecc/frontend-a11y ecc/browser-qa ecc/design-system

ecc/agent-architecture-audit:
  cat: ai-agents
  what: Полная диагностика ИИ-агентов и LLM-приложений по 12 слоям стека с ранжированием проблем по критичности.
  skills: поиск регрессий обёрток; загрязнение памяти агента; нарушения дисциплины инструментов; скрытые циклы самоисправления; искажения при выводе.
  tasks: найти слой, в котором ломается агент; аудит агента перед выпуском; список исправлений в коде.
  with: ecc/agent-introspection-debugging ecc/eval-harness ecc/agent-security-hardening

ecc/agent-eval:
  cat: ai-agents
  what: Сравнение кодовых агентов (Claude Code, Aider, Codex и др.) на ваших задачах по доле успеха, стоимости, времени и стабильности.
  skills: постановка сравнительных задач; метрики pass rate и стоимости; повторные прогоны для оценки стабильности.
  tasks: выбрать агента для команды; измерить эффект изменения настроек агента цифрами, а не впечатлением.
  with: ecc/eval-harness ecc/cost-tracking ecc/benchmark

ecc/agent-harness-construction:
  cat: ai-agents
  what: Проектирование набора инструментов, пространства действий и формата наблюдений ИИ-агента для повышения доли успешных задач.
  skills: дизайн инструментов и их описаний; форматирование ответов инструментов; сокращение лишних действий.
  tasks: создать или переработать набор инструментов агента; повысить надёжность выполнения задач.
  with: ecc/mcp-server-patterns ecc/agent-eval ecc/agentic-engineering

ecc/agent-introspection-debugging:
  cat: ai-agents
  what: Структурированная самодиагностика сбоев ИИ-агента — фиксация, диагноз, ограниченное восстановление и отчёт.
  skills: сбор контекста сбоя; гипотезы о причине; безопасный повторный запуск; отчёт с выводами.
  tasks: разобрать неудачный запуск агента воспроизводимо, а не простым повтором.
  with: ecc/agent-architecture-audit ecc/continuous-agent-loop

ecc/agent-payment-x402:
  cat: web3
  what: Подключение платежей по протоколу x402 к ИИ-агентам с бюджетами на задачу и некастодиальными кошельками.
  skills: бюджеты и лимиты расходов агента; кошельки в сетях Base, X Layer, Solana и EVM; расчёты через фасилитатор.
  tasks: дать агенту возможность самостоятельно платить за API и сервисы под контролем лимитов.
  with: ecc/agent-security-hardening ecc/llm-trading-agent-security

ecc/agent-runtime-gateway-smoke-test:
  cat: ai-agents
  what: Дымовая проверка связки локального API агента, временного туннеля-шлюза и обратного вызова из удалённой песочницы.
  skills: проверка без инструментов; восстановление исходного подключения приложения.
  tasks: убедиться, что агентная инфраструктура связана правильно, перед реальной работой.
  with: ecc/enterprise-agent-ops ecc/canary-watch

ecc/agent-security-hardening:
  cat: security
  what: Защита агентных систем, которые обрабатывают недоверенный контент, вызывают инструменты, пишут файлы и работают с секретами.
  skills: защита от prompt injection; изоляция инструментов; обращение с учётными данными; мультиарендная изоляция; безопасная память агента.
  tasks: ревью безопасности агентного рантайма, шлюза инструментов или сервиса памяти.
  with: ecc/safety-guard ecc/mcp-dependency-review ecc/security-review

ecc/agent-self-evaluation:
  cat: ai-agents
  what: Самооценка агентом результата после задачи по пяти осям — точность, полнота, ясность, применимость, краткость.
  skills: оценочная карта 1–5 с доказательствами; конкретные предложения по улучшению.
  tasks: проверить качество своего ответа перед сдачей; найти слабые места результата.
  with: ecc/verification-loop ecc/santa-method

ecc/agent-sort:
  cat: claude-setup
  what: План установки ECC под конкретный репозиторий — сортировка навыков, команд, правил и хуков на «ежедневные» и «библиотечные».
  skills: анализ репозитория; параллельные проходы ревью; обоснование каждого выбора.
  tasks: урезать ECC до того, что реально нужно проекту; выбрать избранные навыки.
  with: ecc/configure-ecc ecc/skill-stocktake ecc/context-budget

ecc/agentic-engineering:
  cat: ai-agents
  what: Работа в роли агентного инженера — сначала оценки (eval), декомпозиция и маршрутизация моделей по стоимости.
  skills: eval-first подход; разбиение работы на задачи для агентов; выбор модели под сложность задачи.
  tasks: спланировать и выполнить инженерную работу силами агентов от начала до конца.
  with: ecc/blueprint ecc/eval-harness ecc/cost-aware-llm-pipeline

ecc/agentic-os:
  cat: ai-agents
  what: Построение постоянной мультиагентной «операционной системы» на Claude Code — ядро, агенты-специалисты, команды, файловая память, расписания.
  skills: архитектура ядра; память в файлах; slash-команды; автоматизация по расписанию; состояние без внешних БД.
  tasks: создать личную систему агентов со своей памятью и регулярными задачами.
  with: ecc/autonomous-agent-harness ecc/unified-memory ecc/team-agent-orchestration

ecc/ai-first-engineering:
  cat: eng-process
  what: Операционная модель команды, где значительную часть кода пишут ИИ-агенты.
  skills: процессы ревью ИИ-кода; правила владения кодом; quality gates.
  tasks: настроить процесс команды и ответственность для кодовой базы, написанной агентами.
  with: ecc/agentic-engineering ecc/ai-regression-testing ecc/delivery-gate

ecc/ai-regression-testing:
  cat: testing
  what: Регрессионное тестирование при ИИ-разработке — тесты API в песочнице без БД и ловушки для «слепых зон» модели.
  skills: sandbox-тесты API; автоматические проверки на баги; защита от ситуации, когда одна модель пишет и ревьюит код.
  tasks: покрыть регрессиями код, написанный ИИ; проверить изменения, которые ревьюила та же модель.
  with: ecc/tdd-workflow ecc/verification-loop ecc/ai-first-engineering

ecc/android-clean-architecture:
  cat: dev-mobile
  what: Clean Architecture для Android и Kotlin Multiplatform — модули, правила зависимостей, UseCase, репозитории, слой данных.
  skills: модульная структура; направление зависимостей; UseCase и Repository; организация слоя данных.
  tasks: спроектировать или навести порядок в архитектуре Android/KMP-проекта.
  with: ecc/kotlin-patterns ecc/compose-multiplatform-patterns ecc/kotlin-coroutines-flows

ecc/angular-developer:
  cat: dev-frontend
  what: Генерация кода и архитектурные советы по Angular — от сигналов и форм до SSR и тестирования.
  skills: сигналы, linkedSignal, resource; формы; DI; роутинг; SSR; анимации; стили и Tailwind; Angular CLI.
  tasks: создать проект, компоненты и сервисы Angular; применить лучшие практики реактивности.
  with: ecc/typescript-patterns ecc/e2e-testing ecc/accessibility

ecc/api-connector-builder:
  cat: dev-backend
  what: Добавление нового API-коннектора или провайдера строго по образцу уже существующих интеграций проекта.
  skills: анализ существующего паттерна интеграций; повторение структуры без второй архитектуры.
  tasks: подключить ещё один внешний сервис так же, как подключены остальные.
  with: ecc/api-design ecc/error-handling ecc/contract-first

ecc/api-design:
  cat: dev-backend
  what: Паттерны проектирования REST API для продакшена.
  skills: именование ресурсов; коды статусов; пагинация и фильтрация; формат ошибок; версионирование; rate limiting.
  tasks: спроектировать или отревьюить REST-эндпоинты.
  with: ecc/contract-first ecc/backend-patterns ecc/error-handling

ecc/architecture-decision-records:
  cat: eng-process
  what: Фиксация архитектурных решений в нумерованных ADR-файлах в docs/adr с контекстом, альтернативами и последствиями.
  skills: формат ADR; индекс решений; описание компромиссов.
  tasks: записать решение о выборе фреймворка или БД; объяснить, почему кодовая база устроена именно так.
  with: ecc/context-and-decisions ecc/blueprint ecc/change-impact

ecc/article-writing:
  cat: content
  what: Статьи, гайды, посты, туториалы и рассылки в узнаваемом голосе на основе примеров или брендбука.
  skills: перенос стиля из образцов; структура длинного текста; достоверность и аргументация.
  tasks: написать качественный длинный текст в едином голосе автора или бренда.
  with: ecc/brand-voice ecc/content-engine ecc/seo

ecc/automation-audit-ops:
  cat: claude-setup
  what: Инвентаризация автоматизаций — какие задания, хуки, коннекторы и MCP-серверы живы, сломаны, дублируются или отсутствуют.
  skills: сбор доказательств; поиск пересечений; карта автоматизаций.
  tasks: понять состояние автоматизаций прежде, чем что-то чинить.
  with: ecc/config-gc ecc/workspace-surface-audit

ecc/autonomous-agent-harness:
  cat: ai-agents
  what: Превращение Claude Code в автономную агентную систему с постоянной памятью, расписаниями, computer use и очередью задач.
  skills: встроенные расписания и диспетчеризация; память; MCP-инструменты; очередь задач.
  tasks: настроить агента, который работает непрерывно и сам ставит себе задачи.
  with: ecc/agentic-os ecc/continuous-agent-loop ecc/enterprise-agent-ops

ecc/autonomous-loops:
  cat: ai-agents
  what: Архитектуры автономных циклов Claude Code — от простых конвейеров до мультиагентных графов (оставлен для совместимости).
  skills: последовательные пайплайны; RFC-управляемые DAG-системы.
  tasks: справка по старым схемам циклов; для новых задач используйте continuous-agent-loop.
  with: ecc/continuous-agent-loop ecc/ralphinho-rfc-pipeline

ecc/backend-patterns:
  cat: dev-backend
  what: Архитектура бэкенда на Node.js, Express и API-роутах Next.js.
  skills: структура API; доступ к данным; оптимизация запросов к БД; серверные лучшие практики.
  tasks: построить или отревьюить серверную часть на Node.js.
  with: ecc/api-design ecc/postgres-patterns ecc/error-handling

ecc/benchmark:
  cat: devops
  what: Базовые замеры производительности и поиск регрессий — Core Web Vitals, задержки API, скорость сборки и тестов.
  skills: LCP, INP, CLS и вес страницы; перцентили задержек API; сравнение до/после; хранение замеров в git.
  tasks: проверить скорость страниц; разобрать жалобу «тормозит»; сравнить варианты стека.
  with: ecc/benchmark-optimization-loop ecc/react-performance ecc/canary-watch

ecc/benchmark-methodology:
  cat: strategy
  what: Оценка конкурентов по девяти взвешенным измерениям с рубриками 1–5 и картой напряжений.
  skills: позиционирование, голос, визуал, упаковка предложения, доказательства, цены; профили конкурентов.
  tasks: сравнить и оценить конкурентов перед сборкой отчёта.
  with: ecc/competitive-platform-analysis ecc/competitive-report-structure ecc/market-research

ecc/benchmark-optimization-loop:
  cat: devops
  what: Превращение просьбы «сделай быстрее» в измеряемый цикл оптимизации с проверкой корректности.
  skills: замер базовой линии; варианты с одной гипотезой; контроль корректности; воспроизводимые команды.
  tasks: ускорить код или систему и выбрать лучший вариант по цифрам.
  with: ecc/benchmark ecc/latency-critical-systems ecc/data-throughput-accelerator

ecc/bengali-nlp:
  cat: ai-agents
  what: Обработка текста на бенгальском языке для ИИ-приложений.
  skills: нормализация Unicode; определение письменности; токенизация; лигатуры.
  tasks: подготовить бенгальские тексты для NLP и LLM.
  with: ecc/regex-vs-llm-structured-text

ecc/blender-motion-state-inspection:
  cat: media
  what: Проверка персонажей, ригов, поз и анимации в Blender там, где скриншотов недостаточно.
  skills: ретаргетинг анимации; контакт с землёй; направление взгляда; соответствие модели и движения.
  tasks: найти ошибки в 3D-анимации персонажа.
  with: ecc/video-editing

ecc/blueprint:
  cat: eng-process
  what: Превращение цели из одной строки в пошаговый план для многосессионных и мультиагентных проектов.
  skills: шаги размером в один PR; брифы с контекстом; граф зависимостей и параллельные шаги; состязательное ревью плана.
  tasks: спланировать крупную фичу, рефакторинг или roadmap на несколько PR.
  with: ecc/plan-orchestrate ecc/architecture-decision-records ecc/team-agent-orchestration

ecc/brand-discovery:
  cat: content
  what: Многосессионное интервью об идентичности бренда по 8 модулям с итоговым брендбуком.
  skills: техники лэддеринга и «5 почему»; проективные вопросы; сохранение ответов между сессиями.
  tasks: создать или переосмыслить бренд; подготовить бриф для дизайнеров и копирайтеров.
  with: ecc/brand-voice ecc/article-writing ecc/frontend-design-direction

ecc/brand-voice:
  cat: content
  what: Профиль стиля письма на основе реальных текстов автора для повторного использования в контенте и переписке.
  skills: анализ образцов; профиль голоса; защита от шаблонного «ИИ-стиля».
  tasks: писать тексты, неотличимые по стилю от автора.
  with: ecc/article-writing ecc/content-engine ecc/crosspost

ecc/brownfield-retrospective:
  cat: eng-process
  what: Ретроспективный прогон инженерного процесса ECC по существующему проекту с реестром пробелов.
  skills: аудит текущего состояния; реконструкция прошлых решений; реестр пробелов по 4 осям; исправления через план–TDD–ревью.
  tasks: подключить процесс в середине проекта; принять унаследованную кодовую базу.
  with: ecc/codebase-onboarding ecc/change-impact ecc/tdd-workflow

ecc/browser-qa:
  cat: testing
  what: Автоматическая проверка UI после деплоя через браузер — ошибки консоли, Web Vitals, формы, визуальная регрессия, доступность.
  skills: smoke-проверки; тесты форм и авторизации; скриншоты на трёх брейкпоинтах; аудит axe-core; вердикт SHIP/DO-NOT-SHIP.
  tasks: проверить фичу на стейдже; оценить фронтенд-PR перед релизом.
  with: ecc/e2e-testing ecc/canary-watch ecc/accessibility

ecc/bun-runtime:
  cat: dev-backend
  what: Bun как рантайм, менеджер пакетов, бандлер и тест-раннер.
  skills: выбор между Bun и Node; миграция; поддержка на Vercel.
  tasks: решить, переходить ли на Bun, и выполнить переход.
  with: ecc/typescript-patterns ecc/vite-patterns

ecc/canary-watch:
  cat: devops
  what: Мониторинг и проверка развёрнутого URL после релиза.
  skills: проверки HTTP-эндпоинтов и SSE; статические ресурсы; ошибки консоли; регрессии производительности.
  tasks: post-deploy smoke-проверка после релиза, мержа или обновления зависимостей.
  with: ecc/browser-qa ecc/benchmark ecc/deployment-patterns

ecc/carrier-relationship-management:
  cat: operations
  what: Управление портфелем перевозчиков (FTL, LTL, интермодальные) от отбора до продления контрактов.
  skills: проверка перевозчиков; переговоры о ставках и топливных надбавках; тендеры и маршрутные гайды; скоринг перевозчиков.
  tasks: провести тендер на перевозки; оценить и перераспределить объёмы между перевозчиками.
  with: ecc/logistics-exception-management ecc/inventory-demand-planning

ecc/change-impact:
  cat: eng-process
  what: Анализ влияния изменения до его внесения и сверка плана с фактическим диффом после.
  skills: пути вызовов; данные и схемы; API-контракты; тесты, документация, деплой, откат.
  tasks: оценить «радиус поражения» рискованного изменения — миграции, авторизации, публичного API.
  with: ecc/database-migrations ecc/architecture-decision-records ecc/module-regression

ecc/cisco-ios-patterns:
  cat: network
  what: Ревью конфигураций Cisco IOS и IOS-XE.
  skills: show-команды; иерархия конфигурации; wildcard-маски; размещение ACL; гигиена интерфейсов; проверка в окне изменений.
  tasks: прочитать, написать или проверить конфиг Cisco; спланировать окно изменений.
  with: ecc/network-config-validation ecc/netmiko-ssh-automation ecc/network-interface-health

ecc/ck:
  cat: claude-setup
  what: Постоянная память проекта для Claude Code (Context Keeper) через команды /ck и хук начала сессии.
  skills: сохранение состояния и следующих шагов; возобновление работы; краткий бриф проекта при старте.
  tasks: продолжить проект в новой сессии без повторных объяснений.
  with: ecc/unified-memory ecc/strategic-compact

ecc/claude-devfleet:
  cat: ai-agents
  what: Оркестрация параллельных кодовых агентов через Claude DevFleet в изолированных worktree.
  skills: планирование проекта; запуск агентов; мониторинг прогресса; структурированные отчёты.
  tasks: распараллелить разработку между несколькими агентами.
  with: ecc/dmux-workflows ecc/team-agent-orchestration ecc/blueprint

ecc/click-path-audit:
  cat: testing
  what: Трассировка каждой кнопки интерфейса через всю цепочку изменений состояния.
  skills: поиск функций, которые по отдельности работают, но гасят друг друга; проверка итогового состояния UI.
  tasks: найти баги, когда пользователи жалуются на кнопки, а отладка ничего не нашла; проверка после рефакторинга состояния.
  with: ecc/browser-qa ecc/e2e-testing ecc/react-testing

ecc/clickhouse-io:
  cat: data
  what: ClickHouse для высоконагруженной аналитики — схемы, оптимизация запросов, инженерия данных.
  skills: движки таблиц; партиционирование; оптимизация медленных аналитических запросов.
  tasks: спроектировать схему или ускорить аналитический запрос в ClickHouse.
  with: ecc/data-throughput-accelerator ecc/dashboard-builder

ecc/code-tour:
