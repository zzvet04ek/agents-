my/skill-sufficiency:
  cat: productivity
  what: Проверяет, достаточно ли выбранных навыков для полного результата, и определяет нужные дополнения.
  skills: Декомпозиция запроса, матрица покрытия, различение пробелов компетенций, данных, инструментов и полномочий, финальная проверка полноты.
  tasks: Выбрать навыки, обнаружить недостающий метод или источник, продолжить независимую работу и честно обозначить непокрытый результат.
  with: claude-skills/senior-pm claude-skills/product-manager-toolkit
